name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Auto Fix Source and FLAC
        shell: pwsh
        run: |
          # 1. 下载 FLAC 源码包
          curl.exe -L -o flac.zip https://github.com/xiph/flac/archive/refs/tags/1.4.3.zip
          
          # 2. 使用 PowerShell 原生解压
          Expand-Archive -Path "flac.zip" -DestinationPath "." -Force
          
          # 3. 将头文件夹复制到当前目录 (生成 FLAC 文件夹)
          if (Test-Path "FLAC") { Remove-Item -Path "FLAC" -Recurse -Force }
          Copy-Item -Path "flac-1.4.3\include\FLAC" -Destination "." -Recurse -Force
          
          # 4. 清理 BillyPro.cpp 的隐藏 BOM 字符
          $content = Get-Content "BillyPro.cpp" -Raw
          $content = $content.TrimStart([char]0xFEFF)
          [System.IO.File]::WriteAllText("$PWD\BillyPro.cpp", $content, [System.Text.Encoding]::UTF8)

          # 5. 强制编译器使用 UTF-8
          $props = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalOptions>/utf-8 %(AdditionalOptions)</AdditionalOptions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $props

      - name: Build with MSBuild
        run: msbuild BillyPro.vcxproj /p:Configuration=Release /p:Platform=x64 /m /p:PlatformToolset=v143
        
      - uses: actions/upload-artifact@v4
        with:
          name: BillyPro-x64
          path: x64\Release\BillyPro.exe
