name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch and Compile Dependencies (FLAC & dcadec)
        shell: pwsh
        run: |
          # 1. 克隆源码
          git clone https://github.com/xiph/flac.git flac_src --depth 1 --branch 1.4.3
          git clone https://github.com/foo86/dcadec.git dca_src --depth 1
          
          # 2. 编译 FLAC (强制关掉文档生成)
          cd flac_src
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DWITH_OGG=OFF -DINSTALL_MANPAGES=OFF
          cmake --build build --config Release
          cd ..
          
          # 3. 给 dcadec 现场造一个 CMakeLists.txt
          Set-Content -Path "dca_src/CMakeLists.txt" -Value @"
          cmake_minimum_required(VERSION 3.10)
          project(dcadec C)
          file(GLOB SRCS "libdcadec/*.c")
          add_library(dcadec STATIC `${SRCS})
          target_include_directories(dcadec PUBLIC libdcadec)
          "@
          
          # 4. 编译 dcadec
          cd dca_src
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cd ..
          
          # 5. 收集头文件和静态库
          New-Item -ItemType Directory -Force -Path include/FLAC
          New-Item -ItemType Directory -Force -Path lib
          
          Copy-Item -Path flac_src/include/FLAC/* -Destination include/FLAC/ -Force
          Copy-Item -Path flac_src/build/src/lib/Release/libFLAC.lib -Destination lib/ -ErrorAction SilentlyContinue
          
          Copy-Item -Path dca_src/libdcadec/dca_context.h -Destination ./ -Force
          Copy-Item -Path dca_src/libdcadec/dca_frame.h -Destination ./ -Force
          Copy-Item -Path dca_src/build/Release/dcadec.lib -Destination lib/ -ErrorAction SilentlyContinue

          # 6. 清理 BillyPro.cpp 的 BOM
          $content = Get-Content "BillyPro.cpp" -Raw
          $content = $content.TrimStart([char]0xFEFF)
          [System.IO.File]::WriteAllText("$PWD\BillyPro.cpp", $content, [System.Text.Encoding]::UTF8)

      - name: Build BillyPro
        # 把刚才编译出的库直接暴力塞给编译器，顺带加上 /utf-8 防止中文乱码报错
        run: msbuild BillyPro.vcxproj /p:Configuration=Release /p:Platform=x64 /m /p:PlatformToolset=v143 /p:AdditionalIncludeDirectories="${{ github.workspace }}\include;$(pwd)\dca_src\libdcadec" /p:AdditionalDependencies="bass.lib;libFLAC.lib;dcadec.lib;%(AdditionalDependencies)" /p:AdditionalLibraryDirectories="${{ github.workspace }}\lib" /p:AdditionalOptions="/utf-8"
        
      - uses: actions/upload-artifact@v4
        with:
          name: BillyPro-x64
          path: x64\Release\BillyPro.exe
