name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Install FLAC library via vcpkg
        run: vcpkg install flac:x64-windows
        
      - name: Auto Fix Source and Include Paths
        shell: pwsh
        run: |
          # 1. 解压 dcadec_src.zip
          if (Test-Path "dcadec_src.zip") {
            Expand-Archive -Path "dcadec_src.zip" -DestinationPath "." -Force
          }
          
          # 2. 暴力清理 BillyPro.cpp 的 BOM 隐藏字符
          $content = Get-Content "BillyPro.cpp" -Raw
          $content = $content.TrimStart([char]0xFEFF)
          [System.IO.File]::WriteAllText("$PWD\BillyPro.cpp", $content, [System.Text.Encoding]::UTF8)

          # 3. 创建配置文件，强行把所有路径、FLAC库和 UTF-8 灌给编译器
          $props = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalOptions>/utf-8 %(AdditionalOptions)</AdditionalOptions>
                <AdditionalIncludeDirectories>`$(pwd);`$(pwd)\dcadec_src\libdcadec;`$(pwd)\dcadec_src\msvc;C:\vcpkg\installed\x64-windows\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
              <Link>
                <AdditionalLibraryDirectories>C:\vcpkg\installed\x64-windows\lib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
                <AdditionalDependencies>libFLAC.lib;%(AdditionalDependencies)</AdditionalDependencies>
              </Link>
            </ItemDefinitionGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $props
          
      - name: Build with MSBuild
        run: msbuild BillyPro.vcxproj /p:Configuration=Release /p:Platform=x64 /m /p:PlatformToolset=v143
